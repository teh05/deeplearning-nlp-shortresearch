experiment_id: E1a_textcnn
seed: 42
model:
  name: textcnn
  dim: 128
  channels: 128
training:
  max_length: 128
  micro_batch_size: 64
  gradient_accumulation: 1
  learning_rate: 0.001
  weight_decay: 0.0001
  epochs: 5
  gradient_clip: 1.0
  precision: fp32
  target_mode: hard
  consistency_weight: 0.0
selection:
  metric: validation_mean_macro_f1
