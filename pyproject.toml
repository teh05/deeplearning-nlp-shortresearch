[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indodiscourse-research"
version = "0.1.0"
description = "Disagreement-preserving multitask research pipeline for IndoDiscourse"
requires-python = ">=3.10"
dependencies = [
  "torch",
  "transformers",
  "huggingface-hub",
  "pandas",
  "numpy",
  "scikit-learn",
  "matplotlib",
  "seaborn",
  "pyarrow",
  "pyyaml",
  "pytest",
  "tqdm",
  "jupyter",
  "nbconvert",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
